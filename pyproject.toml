[project]
name = "hitl-shorts-pipeline"
version = "0.1.0"
description = "Human-in-the-loop pipeline: keyword analysis -> approval -> script/scene assets -> approval -> render"
requires-python = ">=3.11"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.6", "yt-dlp"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

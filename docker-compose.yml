# Two services: the pipeline (this repo) and MoneyPrinterTurbo's API (pinned in vendor/).
# Everything binds to localhost only.
services:
  mpt:
    # We build MoneyPrinterTurbo with our own recipe instead of its Dockerfile: upstream pins
    # Debian "bullseye", which is end-of-life and no longer downloads. This uses current Debian.
    build:
      context: ./vendor/MoneyPrinterTurbo
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONPATH=/MoneyPrinterTurbo PYTHONUNBUFFERED=1
        WORKDIR /MoneyPrinterTurbo
        RUN apt-get update && apt-get install -y --no-install-recommends git ffmpeg fonts-dejavu-core \
            && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8080
        CMD ["python3", "main.py"]
    command: ["python3", "main.py"]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./config/mpt-config.toml:/MoneyPrinterTurbo/config.toml:ro
      # MoneyPrinterTurbo only reads local clips from this exact folder (a safety rule in its code)
      - ./library/clips:/MoneyPrinterTurbo/storage/local_videos
      # Project folders (pulled images/video) must also appear under that same folder
      # Not read-only: MoneyPrinterTurbo turns each image into a short .mp4 written next to it
      - ./projects:/MoneyPrinterTurbo/storage/local_videos/projects
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach Ollama running on the host
    restart: unless-stopped

  pipeline:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env]
    environment:
      MPT_BASE_URL: http://mpt:8080
      CLIPS_DIR_HOST: /app/library/clips     # where the pipeline sees the library
      CLIPS_DIR_IN_MPT: /MoneyPrinterTurbo/storage/local_videos  # where MoneyPrinterTurbo sees the same folder
      # host-path=path-in-MPT pairs, so the renderer can find each project's files
      PATH_MAP: "/app/projects=/MoneyPrinterTurbo/storage/local_videos/projects"
    volumes:
      - ./projects:/app/projects
      - ./library/scraped:/app/library/scraped
      - ./library/clips:/app/library/clips
      - ./config/pipeline.toml:/app/config/pipeline.toml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [mpt]
    restart: unless-stopped

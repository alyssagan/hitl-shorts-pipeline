# Settings for the pipeline service itself (not MoneyPrinterTurbo -- see config/mpt-presets/).
# Secrets do not go here; use .env (KEYWORD_LLM_API_KEY, MPT_API_KEY, ...).

[storage]
# One folder per video project lives here: projects/<name>-<id>/
data_dir = "projects"

[review]
# Written to the decision log when a request doesn't say who is deciding. Leave blank to always ask.
default_reviewer = ""

[sources]
# Where text and images are pulled from. Each source gets its own folder in every project.
user_agent = "hitl-shorts-pipeline/0.1 (personal video research tool)"
max_queries = 8          # how many approved keywords to search with
per_query = 8            # photos to keep per keyword, per source
videos_per_query = 4     # videos to keep per keyword, per source (counted separately from photos)
wikipedia_articles = 2
pexels_videos = true
pixabay_videos = true
nasa_videos = true
# Internet Archive: most items have no licenseurl even when they're public domain, so by default
# they're kept anyway (license shows as unknown, and vetting flags it for you to check) rather than
# silently dropped from search results. Set true to go back to only keeping explicitly-licensed items.
archive_require_license = false
archive_max_mb = 60
# URL list (yt-dlp): biggest download and tallest video to accept.
url_max_mb = 200
url_max_height = 1080
folder_path = "library/scraped"   # drop your own scraper's output here (used by the "folder" source)

[library]
# Your scraper / AI-generation output lands here. Scene clips are picked from it.
clips_dir = "library/clips"
# Docker only: the same folder as seen by the host and by the MoneyPrinterTurbo
# container, so render requests can translate paths. Leave blank outside Docker.
clips_dir_host = ""
clips_dir_in_mpt = ""

[keywords]
# Used with `--keywords llm`. Any OpenAI-compatible endpoint works: Gemini (free tier, the default here),
# OpenAI, OpenRouter, or a local Ollama ("http://localhost:11434/v1").
# The key is KEYWORD_LLM_API_KEY from .env if set, otherwise the variable named in api_key_env (your Gemini key).
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.6-flash"
api_key_env = "GEMINI_API_KEY"
count = 10

[llm_fallback]
# A single backup provider for every LLM call in the pipeline (keywords, relevance scoring, script writing).
# When Gemini's free tier is still down after its own retries (docs/LOGGING.md: 429/500/502/503/504, waits
# 4/10/25/45s), the SAME call is retried once more against this provider before giving up -- see docs/LOGGING.md
# "LLM fallback provider" for exactly what gets logged when this happens.
#
# Off automatically until GROQ_API_KEY (or LLM_FALLBACK_API_KEY) is set in .env -- same "never a hard
# requirement" pattern as [relevance]'s LLM step. `enabled = false` turns it off even with a key present.
#
# Default is Groq (api.groq.com) -- a different company from xAI's Grok, easy to mix up. Groq has a genuine
# free developer tier (no credit card) and is an OpenAI-compatible drop-in swap, which is why the shape below
# matches [keywords]/[relevance]/[script] exactly. Get a free key at https://console.groq.com/keys.
#
# model: Groq moved llama-3.3-70b-versatile (and llama-3.1-8b-instant) to enterprise-only access on
# 2026-08-16 -- a free/developer-tier key now gets a 404 "does not exist or you do not have access to it"
# for it, not a graceful fallback. openai/gpt-oss-120b is Groq's own recommended free-tier replacement
# (similar capability tier); openai/gpt-oss-20b is a faster/cheaper option if quality can flex.
enabled = true
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"

[relevance]
# Hybrid relevance scoring for asset review (docs/SCORING.md): a deterministic, local TF-IDF score (no network,
# no rate limit, same answer every time) is computed for every pending asset. The LLM below is only asked for a
# second opinion on assets whose TF-IDF score is "borderline" -- within `borderline_band` of `min_relevance` --
# so most runs need only a handful of LLM calls, not one batch per asset. Falls back to word-matching (per
# asset) if TF-IDF finds no usable text; falls back to the TF-IDF score (per asset) if the LLM is disabled,
# unkeyed, or a batch fails.
enabled = true
# Leave base_url/model unset to reuse the [keywords] Gemini config above (same free tier). RELEVANCE_LLM_API_KEY
# overrides the key from .env if set, otherwise api_key_env (defaults to the same GEMINI_API_KEY as [keywords]).
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-3.6-flash"
api_key_env = "GEMINI_API_KEY"
batch_size = 25
# How close to min_relevance (0..1) a TF-IDF score has to be to count as "borderline" and get a second LLM
# opinion. Bigger = more LLM calls but fewer TF-IDF-only judgment calls near the threshold.
borderline_band = 0.15
# Hard cap on how many borderline assets get sent to the LLM in a single vetting round, even if more qualify.
# The ones closest to the threshold (hardest to call) go first; the rest simply keep their TF-IDF score this
# round and can still be picked up on a later "search again" round.
max_llm_per_round = 40

[script]
# Our own script writer (longer and better grounded than MoneyPrinterTurbo's). Uses any
# OpenAI-compatible endpoint; the default is Gemini's free tier with GEMINI_API_KEY from .env.
# Set provider = "mpt" (or leave the key empty) to let MoneyPrinterTurbo write the script instead.
provider = "llm"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.6-flash"
api_key_env = "GEMINI_API_KEY"
# About 2.6 words per second when spoken: 260 words is roughly 100 seconds.
target_words = 260
# Characters of source text (Wikipedia etc.) the writer may read, split across the articles.
grounding_chars = 12000

[usage]
# Tokens and $ cost provenance for every LLM call (docs/LOGGING.md "Tokens / cost"). Every call already gets its
# own entry in the decision log with real token counts from the model's reply; this section only supplies the
# two things that can't come from the reply itself: what a model's tokens actually cost, and how big its free
# tier is, so the numbers can be read as "how much would this have cost" / "how close to the free limit am I".

# $ per 1,000,000 tokens. A model with no entry here (every model this pipeline ships pointed at by default --
# gemini-3.6-flash on the free tier) simply costs $0, which is accurate, not a placeholder. Add a row here the
# day you point [keywords]/[relevance]/[script] at a paid model or a paid tier, and real $ estimates appear
# automatically -- no other code changes.
# [usage.prices.gemini-3.6-flash]
# prompt_per_mtok = 0.0
# completion_per_mtok = 0.0
# [usage.prices.gpt-4o-mini]
# prompt_per_mtok = 0.15
# completion_per_mtok = 0.60

# Purely informational (not enforced -- the pipeline doesn't rate-limit itself against this): Google's published
# free-tier limits for the model(s) you use, so GET /jobs/{id}/usage and the decision log can show how close a
# job's call count came to them. Update these if Google changes the free tier.
[usage.free_quota.gemini-3.6-flash]
requests_per_minute = 15
requests_per_day = 1500

[mpt]
base_url = "http://localhost:8080"     # docker-compose overrides via MPT_BASE_URL
aspect = "9:16"
# How long MoneyPrinterTurbo shows a single clip/image before cutting to the next (its own
# video_clip_duration). Was 5; 3 is MoneyPrinterTurbo's own WebUI default and cuts noticeably faster,
# which matters for short-form retention -- a video that lingers on one still is an easy scroll-past.
clip_seconds = 3
paragraphs = 3
language = ""
# Free Edge voice (needs internet). Other examples: "en-US-GuyNeural-Male", or "elevenlabs:<voice_id>:<name>"
voice_name = "en-US-AriaNeural-Female"
# Per-scene audio previews at the scene-review gate (slower; one TTS call per scene).
generate_scene_audio = false

# --- Retention styling, forwarded to MoneyPrinterTurbo's /api/v1/videos -----------------------------
# Every field below used to go unsent, so every render used MoneyPrinterTurbo's own bare defaults --
# unstyled "sentence" captions, no animation, no music. Full option reference:
# vendor/MoneyPrinterTurbo/config.example.toml, the commented-out [ui] block. Leave any field "" (or
# 0 / commented out) to fall back to MoneyPrinterTurbo's own default for that one field.
subtitle_display_mode = "word_by_word"   # "sentence" or "word_by_word" -- word-by-word reveal reads as
                                          # punchier and more native to TikTok/Reels than a full caption
                                          # appearing all at once.
subtitle_animation = "pop_spring"        # "none" or "pop_spring"
font_name = ""              # "" = MoneyPrinterTurbo's own default font
font_size = 0                # 0 = MoneyPrinterTurbo's own default (60)
text_fore_color = ""
stroke_color = ""
stroke_width = 0.0
subtitle_position = ""       # "top" | "center" | "bottom" | "two_thirds_bottom" | "custom"
subtitle_background_enabled = false
subtitle_background_color = ""
# "" = MoneyPrinterTurbo's own default (no transition). Try "Shuffle" or "FadeIn" for more movement
# between clips -- left off by default since we haven't watched a rendered example with one yet.
video_transition_mode = ""
video_fit_mode = ""          # "" = MoneyPrinterTurbo's own default ("cover": fills the frame, crops overflow)
voice_volume = 0.0           # 0 = MoneyPrinterTurbo's own default (1.0)
voice_rate = 0.0             # 0 = MoneyPrinterTurbo's own default (1.0)
bgm_type = "random"          # "random" (MoneyPrinterTurbo's built-in library) | "" (off) | set custom_bgm_file
bgm_volume = 0.12            # kept low and under the narration; MoneyPrinterTurbo's own default is 0.2
custom_bgm_file = ""
# Platform-ready title/caption/hashtags, generated from the final script after every render (MoneyPrinterTurbo's
# own /api/v1/social-metadata) and written to SOCIAL_POST.md in the project folder, paste-ready. One extra LLM
# call per platform per render. Options: "tiktok", "youtube_shorts", "instagram_reels", "facebook_reels".
# Empty list disables this.
social_platforms = ["instagram_reels", "tiktok", "youtube_shorts"]
